# Lives in the root of the BlogAssets repository (.github/workflows) - GitHub only reads workflows there.
name: Entra ID credential rotation

on:
  push:
    branches: [main]
    paths:
      - 'Automatic Credential Rotation for Entra ID Apps/**'
      - '.github/workflows/entra-credential-rotation.yml'
  pull_request:
    paths:
      - 'Automatic Credential Rotation for Entra ID Apps/**'
      - '.github/workflows/entra-credential-rotation.yml'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for azure/login and the azurerm backend/provider
  contents: read

env:
  PROJECT_DIR: 'Automatic Credential Rotation for Entra ID Apps'
  ARM_USE_OIDC: 'true'
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: 'true'

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=entra-credential-rotation.tfstate"
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -input=false -var-file=production.tfvars -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.PROJECT_DIR }}/infra/tfplan
          retention-days: 5

  build-function:
    # The template's build script uses backslash paths and a 'Functions' folder name - build on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}/function-app
    steps:
      - uses: actions/checkout@v5
      - name: PSScriptAnalyzer
        run: |
          Install-PSResource PSScriptAnalyzer -TrustRepository -Quiet
          $findings = Invoke-ScriptAnalyzer -Path ./SecretRotation -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize
          if ($findings) { throw "$($findings.Count) PSScriptAnalyzer finding(s)" }
      - name: Offline tests
        run: ./tests/Test-SecretRotation.ps1
      - name: Build Function.zip
        run: ./build/psf-build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: ${{ env.PROJECT_DIR }}/function-app/Function.zip
          retention-days: 5

  terraform-apply:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [terraform-plan, build-function]
    runs-on: ubuntu-latest
    environment: production
    outputs:
      function_app_name: ${{ steps.out.outputs.function_app_name }}
      resource_group_name: ${{ steps.out.outputs.resource_group_name }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.PROJECT_DIR }}/infra
      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=entra-credential-rotation.tfstate"
      - name: terraform apply (exactly the reviewed plan)
        run: terraform apply -input=false tfplan
      - id: out
        run: |
          echo "function_app_name=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"

  deploy-function:
    needs: [terraform-apply]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: function-package
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.terraform-apply.outputs.function_app_name }}
          package: Function.zip
