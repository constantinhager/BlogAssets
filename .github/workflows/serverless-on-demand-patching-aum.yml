name: Deploy Azure Update Manager Automation

on:
  push:
    branches: [main]
    paths:
      - "Serverless On‑Demand Patching for Azure Update Manager/**"
      - ".github/workflows/serverless-on-demand-patching-aum.yml"
  pull_request:
    branches: [main]
    paths:
      - "Serverless On‑Demand Patching for Azure Update Manager/**"
      - ".github/workflows/serverless-on-demand-patching-aum.yml"
  workflow_dispatch:

# OIDC: GitHub issues a short-lived token, Entra ID trusts it via the federated credential.
permissions:
  id-token: write
  contents: read

# Never run two deployments against the same state at once
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Serverless On‑Demand Patching for Azure Update Manager/infra"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Upload plan
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            Serverless On‑Demand Patching for Azure Update Manager/infra/tfplan
            Serverless On‑Demand Patching for Azure Update Manager/infra/.terraform.lock.hcl
          retention-days: 1

  build-function:
    name: Build Function App (PSModuleDevelopment template)
    # psf-build.ps1 builds paths with backslashes, so it needs a Windows runner
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The template's build script bundles all modules (Flex Consumption = no Managed Dependencies)
      # and generates one trigger per file in <module>/functions/*Trigger.
      # psf-build.ps1 bootstraps PSFramework.NuGet and saves the modules with Save-PSFModule.
      - name: Build Function.zip
        shell: pwsh
        run: ./function-app/build/psf-build.ps1
        working-directory: "Serverless On‑Demand Patching for Azure Update Manager"

      - name: Show package content
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::OpenRead("$PWD/Serverless On‑Demand Patching for Azure Update Manager/function-app/Function.zip").Entries.FullName |
            Where-Object { $_ -notmatch '^Modules/.+/.+/' }

      - uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: "Serverless On‑Demand Patching for Azure Update Manager/function-app/Function.zip"
          retention-days: 7

  terraform-apply:
    name: Terraform apply
    needs: [terraform-plan, build-function]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: "Serverless On‑Demand Patching for Azure Update Manager/infra"
    outputs:
      function_app_name: ${{ steps.out.outputs.function_app_name }}
      resource_group_name: ${{ steps.out.outputs.resource_group_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: "Serverless On‑Demand Patching for Azure Update Manager/infra"

      - name: Terraform init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"

      - name: Terraform apply
        run: terraform apply tfplan

      - name: Read outputs
        id: out
        run: |
          echo "function_app_name=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"

  deploy-function:
    name: Deploy Function App
    needs: [terraform-apply]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: function-package

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Flex Consumption
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.terraform-apply.outputs.function_app_name }}
          package: Function.zip

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Function App: \`${{ needs.terraform-apply.outputs.function_app_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Resource group: \`${{ needs.terraform-apply.outputs.resource_group_name }}\`" >> "$GITHUB_STEP_SUMMARY"
